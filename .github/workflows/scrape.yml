name: Weekly competitor scrape
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Scrape + match + metrics
        run: node src/pipeline/run-all.js dolcesalato waitrose spinneys
